# Servo task map for tauv_servo/servo_driver.
#
# Publish a task name (std_msgs/String) on the command topic (default
# /servo/task) to run it. Names are matched case-insensitively.
#
# A task is an ordered list of actions. An action is simply:
#
#     {servo_id: <int>, angle: <degrees>}
#
# `angle` is ABSOLUTE, 0-360 deg, where 180 is the servo's center. The servo
# has an absolute encoder and no homing, so a given mechanism position is
# always the same absolute angle. Don't guess angles — measure them once with:
#
#     ros2 run tauv_servo find_setpoints
#
# A target outside a servo's position window (below) is refused and the task
# reports failed (Status.status = 0) — the servo would otherwise clamp to the
# limit and physically drive there.

# Per-servo setup, applied once at node startup:
#   id            mechanism name reported on the status topic (Status.id).
#                 One of: dropper, torpedo, watchdog, trajectory.
#   torque_limit  0-100 % motor output cap, applied BEFORE the motor engages.
#   min_angle /   absolute position window in degrees. Written to the servo
#   max_angle     itself, which enforces it in hardware — a bug in the driver
#                 cannot push a mechanism past it. Omit both to fall back to
#                 the global position_limit_deg parameter (default 30-330).
servos:
  1:
    id: torpedo           # reported as Status.id = "torpedo"
    torque_limit: 50
    min_angle: 120
    max_angle: 210

  2:
    id: dropper           # reported as Status.id = "dropper"
    torque_limit: 25      # full-range servo; window defaults to 30-330
    min_angle: 300
    max_angle: 360

tasks:
  # --- servo 2 (dropper) ------------------------------------------------------
  reset_dropper:
    - {servo_id: 2, angle: 350}

  trump:
    - {servo_id: 2, angle: 330}

  biden:
    - {servo_id: 2, angle: 300}

  # --- servo 1 (torpedo) ------------------------------------------------------
  # Measure the real angles with find_setpoints, then fill these in (and set
  # min_angle/max_angle above so the servo enforces the window):
  reset_torpedo:
    - {servo_id: 1, angle: 156}
  farnam:
    - {servo_id: 1, angle: 200}
  fence:
    - {servo_id: 1, angle: 130}
